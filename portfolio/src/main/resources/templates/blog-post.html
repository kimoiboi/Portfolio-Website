<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>Karim Elgendi · Blog Post</title>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" th:href="@{/style.css(v=3)}">
    <script src="https://kit.fontawesome.com/1eeb4b521d.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav id="navbar">
        <ul>
            <li><a th:href="@{/index.html}">About</a></li>
            <li><a th:href="@{/projects}">Projects</a></li>
            <li><a th:href="@{/blog}">Blog</a></li>
            <li><a href="#contact-section">Contact</a></li>
            <li><a th:href="@{/resume.html}">Resume</a></li>
        </ul>
    </nav>

    <main class="blog-detail-page">
        <div class="blog-detail-toolbar">
            <a class="blog-back-link" th:href="@{/blog}">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Blog
            </a>

            <div sec:authorize="hasRole('ADMIN')" class="admin-add-wrapper">
                <button class="project-blog-add-button" id="set-dropdown" type="button" style="display: none;">
                    <span>Edit Post</span>
                    <i class="fas fa-pen"></i>
                </button>

                <div class="blog-modal-backdrop add-dropdown blog-admin-dropdown" id="dropdown" aria-hidden="true">
                    <div class="blog-admin-window" role="dialog" aria-modal="true" aria-labelledby="blogModalTitle">
                        <div class="blog-window-topbar">
                            <div class="blog-window-dots">
                                <span class="blog-dot blog-dot-red"></span>
                                <span class="blog-dot blog-dot-yellow"></span>
                                <span class="blog-dot blog-dot-green"></span>
                            </div>

                            <h2 id="blogModalTitle" class="blog-modal-title">Edit Post</h2>

                            <button class="blog-modal-x" id="blogCancel" type="button" aria-label="Close edit form">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form id="blogPostForm" class="blog-post-form">
                            <label for="blogTitle">Title</label>
                            <input id="blogTitle" name="title" type="text" placeholder="(e.g. My First Blog Post)" required>

                            <label for="blogUrl">URL Slug</label>
                            <input id="blogUrl" name="url" type="text" placeholder="(e.g. my-first-blog-post)">

                            <label for="blogImageFile">Card Image (leave empty to keep current image)</label>
                            <div class="blog-image-input">
                                <input id="blogImageFile" name="imageFile" type="file" accept="image/*">
                                <input id="blogImageUrl" name="imageUrl" type="hidden">
                            </div>

                            <label>Summary</label>
                            <div class="rte" data-rte-name="summary">
                                <div class="rte-toolbar" role="toolbar" aria-label="Summary formatting">
                                    <button type="button" class="rte-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><i class="fa-solid fa-bold"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i class="fa-solid fa-italic"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="inlineCode" title="Inline code" aria-label="Inline code"><i class="fa-solid fa-code"></i></button>
                                    <span class="rte-sep" aria-hidden="true"></span>
                                    <button type="button" class="rte-btn" data-cmd="link" title="Insert link" aria-label="Insert link"><i class="fa-solid fa-link"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="clear" title="Clear formatting" aria-label="Clear formatting"><i class="fa-solid fa-eraser"></i></button>
                                </div>
                                <div id="blogSummary" class="rte-area rte-area-summary" contenteditable="true" data-placeholder="Short summary displayed on card"></div>
                            </div>

                            <label>Content</label>
                            <div class="rte" data-rte-name="content">
                                <div class="rte-toolbar" role="toolbar" aria-label="Content formatting">
                                    <button type="button" class="rte-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><i class="fa-solid fa-bold"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i class="fa-solid fa-italic"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="inlineCode" title="Inline code" aria-label="Inline code"><i class="fa-solid fa-code"></i></button>
                                    <span class="rte-sep" aria-hidden="true"></span>
                                    <button type="button" class="rte-btn" data-cmd="h2" title="Heading 2" aria-label="Heading 2"><i class="fa-solid fa-heading"></i><span class="rte-h-level">2</span></button>
                                    <button type="button" class="rte-btn" data-cmd="h3" title="Heading 3" aria-label="Heading 3"><i class="fa-solid fa-heading"></i><span class="rte-h-level">3</span></button>
                                    <span class="rte-sep" aria-hidden="true"></span>
                                    <button type="button" class="rte-btn" data-cmd="insertUnorderedList" title="Bullet list" aria-label="Bullet list"><i class="fa-solid fa-list-ul"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list"><i class="fa-solid fa-list-ol"></i></button>
                                    <span class="rte-sep" aria-hidden="true"></span>
                                    <button type="button" class="rte-btn" data-cmd="link" title="Insert link" aria-label="Insert link"><i class="fa-solid fa-link"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="image" title="Insert image" aria-label="Insert image"><i class="fa-solid fa-image"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="video" title="Embed video" aria-label="Embed video"><i class="fa-solid fa-video"></i></button>
                                    <button type="button" class="rte-btn" data-cmd="table" title="Insert table" aria-label="Insert table"><i class="fa-solid fa-table"></i></button>
                                    <span class="rte-sep" aria-hidden="true"></span>
                                    <button type="button" class="rte-btn" data-cmd="clear" title="Clear formatting" aria-label="Clear formatting"><i class="fa-solid fa-eraser"></i></button>
                                </div>
                                <div id="blogContent" class="rte-area rte-area-content" contenteditable="true" data-placeholder="Write your full blog post here..."></div>
                                <input type="file" class="rte-image-input" accept="image/*" hidden>
                            </div>

                            <div class="blog-form-actions">
                                <button class="blog-form-primary" type="submit">Save Changes</button>
                                <button class="blog-form-secondary" type="button" id="blogCancelBottom">Cancel</button>
                            </div>

                            <p id="blogFormMessage" class="blog-form-message"></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <article id="blogPostDetail" class="blog-detail-card">
            <p style="text-align:center;">Loading blog post...</p>
        </article>
    </main>

    <footer>
        <p style="font-size: 12.3px; text-align: center;">&copy; 2026 Karim Elgendi. All rights reserved.</p>
    </footer>

    <script th:src="@{/scripts/script.js(v=3)}"></script>
</body>
</html>
